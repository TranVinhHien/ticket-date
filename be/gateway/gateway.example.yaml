app:
  name: "gateway"
  version: "v1.0.0"

http_server:
  host: "0.0.0.0"
  port: 8000
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Request-ID"
    - "X-User-ID"
    - "X-User-Email"
    - "X-User-Roles"
    - "Idempotency-Key"
  mode: "debug"
  log_level: "debug"

logger:
  level: "debug"
  pretty: true

token:
  secret: "change-me-to-a-long-random-secret"

permissions:
  file_path: "./config/permissions.json"


gateway:
  routes:
    # Public Auth routes (login, register, refresh) -> Forwarded to user
    - prefix: "/api/v1/auth"
      target: "http://localhost:8080"
      auth_required: false

    # User Profile & Management (Protected) -> Forwarded to user
    - prefix: "/api/v1/users"
      target: "http://localhost:8080"
      auth_required: true

    # Uploads (Protected) -> Forwarded to user
    - prefix: "/api/v1/upload"
      target: "http://localhost:8080"
      auth_required: true

    # event Service (Public metadata browsing)
    - prefix: "/api/v1/organizers"
      target: "http://localhost:8081"
      auth_required: false

    - prefix: "/api/v1/venues"
      target: "http://localhost:8081"
      auth_required: false

    - prefix: "/api/v1/events"
      target: "http://localhost:8081"
      auth_required: false

    # inventory Service
    - prefix: "/api/v1/inventories"
      target: "http://localhost:8082"
      auth_required: true

    # Listening Event Service (User playback events - Protected)
    - prefix: "/api/v1/orders"
      target: "http://localhost:8083"
      auth_required: true

