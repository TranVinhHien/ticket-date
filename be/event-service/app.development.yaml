app:
  name: "event-service"
  version: "v1.0.0"

http_server:
  host: "0.0.0.0"
  port: 8081
  grpc_port: 50051
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  mode: "debug"
  log_level: "debug"

token:
  secret: "change-me-to-a-long-random-secret"

cockroach_db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  db_name: "ticket"
  ssl_mode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: "10m"
  log_level: "info"
