app:
  name: "inventory"
  version: "v1.0.0"

http_server:
  host: "0.0.0.0"
  port: 8082
  grpc_port: 50052
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  mode: "debug"
  log_level: "debug"

token:
  secret: "change-me-to-a-long-random-secret"
  access_token_expiration_time: 3600
  refresh_token_expiration_time: 86400

cockroach_db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  db_name: "inventory"
  ssl_mode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: "10m"
  log_level: "info"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5

kafka:
  brokers: ["localhost:9092"]
  client_id: "inventory-service"
  group_id: "inventory-service-group"
  topics: ["order.events"]
  max_retries: 3
  retry_backoff: "500ms"
  dlq_enabled: true
  dlq_suffix: ".dlq"
  topic_order_events: "order.events"

aws:
  region: "ap-northeast-2"
  access_key_id: "YOUR_AWS_ACCESS_KEY_ID"
  secret_access_key: "YOUR_AWS_SECRET_ACCESS_KEY"
  bucket_name: "your-s3-bucket-name"
