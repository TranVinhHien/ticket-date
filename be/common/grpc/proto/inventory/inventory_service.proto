syntax = "proto3";

package inventory;

option go_package = "github.com/TranVinhHien/ticket-date/be/common/grpc/pb/inventory;pbInventory";

service InventoryService {
  rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
  rpc RestoreStock(RestoreStockRequest) returns (RestoreStockResponse);
}

message DeductItem {
  string ticket_type_id = 1;
  int32 quantity = 2;
}

message DeductStockRequest {
  repeated DeductItem items = 1;
}

message DeductStockResponse {
  bool success = 1;
}

message RestoreItem {
  string ticket_type_id = 1;
  int32 quantity = 2;
}

message RestoreStockRequest {
  repeated RestoreItem items = 1;
}

message RestoreStockResponse {
  bool success = 1;
}
