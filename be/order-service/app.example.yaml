app:
  name: "order"
  version: "v1.0.0"

http_server:
  host: "0.0.0.0"
  port: 8083
  grpc_port: 50053
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  mode: "debug"
  log_level: "debug"

grpc_client:
  event_host: localhost
  event_port: 50051
  inventory_host: localhost
  inventory_port: 50052

token:
  secret: "change-me-to-a-long-random-secret"
  access_token_expiration_time: 3600
  refresh_token_expiration_time: 86400

cockroach_db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  db_name: "order"
  ssl_mode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: "10m"
  log_level: "info"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5

aws:
  region: "ap-northeast-2"
  access_key_id: "YOUR_AWS_ACCESS_KEY_ID"
  secret_access_key: "YOUR_AWS_SECRET_ACCESS_KEY"
  bucket_name: "your-s3-bucket-name"

kafka:
  brokers: ["localhost:9092"]
  client_id: "order-service"
  group_id: "order-service-group"
  max_retries: 3
  retry_backoff: "500ms"
  dlq_enabled: true
  dlq_suffix: ".dlq"
  compression: "lz4"
  batch_max_bytes: 1048576
  linger_ms: 10
  max_buffered_records: 100000
  allow_auto_topic: true

cron:
  enabled: true
  pending_orders:
    enabled: true
    interval: "1m"
    batch: 100
  outbox_relay:
    enabled: true
    interval: "2s"
    batch: 100
